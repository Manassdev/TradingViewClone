<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to TradingView</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/auth-page.css">
</head>
<body>

  <div class="auth-page-container">
    
    <!-- LEFT PANEL: Promotional image -->
    <div class="auth-promo-panel">
      <div class="promo-image-container">
        <img src="assets/login-promo.jpg" alt="Look first, then leap.">
        <div class="promo-text">
          <h1>Look first<br>Then leap.</h1>
        </div>
        <button class="promo-control-btn" title="Pause Background" aria-label="Pause Background">
          <i data-lucide="pause"></i>
        </button>
      </div>
    </div>
    
    <!-- RIGHT PANEL: Sign-in Form -->
    <div class="auth-form-panel">
      <!-- Top header with branding and close button -->
      <div class="auth-form-header">
        <a href="index.html" class="auth-brand-logo">
          <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 14c2.5-4 4.5 4 7 0 2.5-4 4.5 4 7 0" />
            <line x1="17" y1="21" x2="22" y2="7" />
            <circle cx="25" cy="7" r="1.5" fill="currentColor" stroke="none" />
          </svg>
          <span>TradingView</span>
        </a>
        <button class="auth-close-btn" onclick="window.location.href='index.html'" title="Close">
          <i data-lucide="x"></i>
        </button>
      </div>
      
      <!-- Main Content Area -->
      <div class="auth-form-content">
        <h2 class="auth-title">Sign in</h2>
        
        <!-- Google Card Option (Quick login) -->
        <div class="google-account-card" onclick="handleGoogleSignIn()" title="Sign in with Google">
          <div class="google-left">
            <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <div class="google-user-info">
              <span class="google-name">Google User</span>
              <span class="google-email">google@test.com</span>
            </div>
          </div>
          <i data-lucide="chevron-down" class="google-arrow"></i>
        </div>
        
        <!-- Show more options link -->
        <div class="show-more-options">
          <span>Show more options</span>
          <i data-lucide="chevron-down"></i>
        </div>
        
        <!-- Divider -->
        <div class="auth-divider">
          <span class="divider-line"></span>
          <span class="divider-text">or</span>
          <span class="divider-line"></span>
        </div>
        
        <!-- Email toggle button -->
        <button class="email-btn" onclick="toggleEmailForm()">
          <i data-lucide="mail"></i>
          <span>Email</span>
        </button>
        
        <!-- Email/Password fields (Toggled on click) -->
        <form id="email-auth-form" class="email-auth-form-fields" style="display: none;" onsubmit="handleSignInSubmit(event)">
          <div id="signin-error" class="auth-error-message" style="display: none;"></div>
          
          <div class="form-group">
            <label for="signin-email">Email or Username</label>
            <input type="text" id="signin-email" placeholder="demo@test.com" required>
          </div>
          
          <div class="form-group">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="auth-form-submit">Sign in</button>
        </form>
        
        <!-- Switch to Sign Up -->
        <div class="auth-switch-text">
          <span>Do not have an account?</span>
          <a href="signup.html" class="auth-switch-link">Sign up</a>
        </div>
      </div>
    </div>
    
  </div>

  <script src="js/api.js"></script>
  <script>
    // Initialize icons
    lucide.createIcons();

    // Toggle the display of the email sign-in form
    function toggleEmailForm() {
      const form = document.getElementById('email-auth-form');
      if (form.style.display === 'none') {
        form.style.display = 'flex';
      } else {
        form.style.display = 'none';
      }
    }

    function handleGoogleSignIn() {
      const errorBox = document.getElementById('signin-error');
      errorBox.innerText = 'Google sign-in is not configured. Use email and password.';
      errorBox.style.display = 'block';
    }

    // Email form submit validator
    async function handleSignInSubmit(e) {
      e.preventDefault();
      const emailInput = document.getElementById('signin-email');
      const passInput = document.getElementById('signin-password');
      const errorBox = document.getElementById('signin-error');

      if (!emailInput || !passInput || !errorBox) return;

      const email = emailInput.value.trim();
      const password = passInput.value;
      const submit = e.currentTarget.querySelector('button[type="submit"]');

      errorBox.style.display = 'none';
      if (submit) { submit.disabled = true; submit.innerText = 'Signing in…'; }

      try {
        const result = await TradingApi.login({ login: email, password });
        TradingApi.setSession(result.token);
        window.location.href = 'index.html';
      } catch (error) {
        errorBox.innerText = error.message || 'Sign-in failed';
        errorBox.style.display = 'block';
      } finally {
        if (submit) { submit.disabled = false; submit.innerText = 'Sign in'; }
      }
    }
  </script>
</body>
</html>
